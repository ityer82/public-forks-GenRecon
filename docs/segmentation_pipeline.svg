<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1478" viewBox="0 0 1340 1478" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1340" height="1478" fill="white"/>
<rect x="14" y="146.0" width="1312" height="592.0" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="1312.0" y="164.0" text-anchor="end" font-size="13" fill="#555" font-weight="bold">Stage 1: per-object 2D masks (detect_and_segment.py)</text>
<rect x="14" y="750.0" width="1312" height="610.0" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="1312.0" y="768.0" text-anchor="end" font-size="13" fill="#555" font-weight="bold">Stage 1.5: lifting to a per-object 3D point cloud (segment_pointcloud.py)</text>
<polyline points="237.0,150.0 603.0,150.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="400.0,114.0 400.0,150.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="237.0,150.0 237.0,185.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="603.0,150.0 603.0,185.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="237.0,289.0 603.0,289.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="237.0,270.0 237.0,289.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="603.0,270.0 603.0,289.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="400.0,289.0 400.0,307.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,372.0 400.0,409.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,474.0 400.0,541.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,586.0 400.0,653.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,718.0 400.0,809.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,874.0 400.0,961.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,1006.0 400.0,1075.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,1140.0 400.0,1179.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="400.0,1244.0 400.0,1281.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="269.0,1365.0 563.0,1365.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="400.0,1346.0 400.0,1365.0" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="269.0,1365.0 269.0,1383.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="563.0,1365.0 563.0,1383.0" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="174.0,50.0 640.0,50.0 626.0,114.0 160.0,114.0" fill="#eef3ff" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="73.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Stage 0 export</text>
<text x="400.0" y="93.9" text-anchor="middle" font-size="14" fill="#333">rgb/  depth/ + depth_conf  camera poses  sparse points</text>
<rect x="49.0" y="186.0" width="376.0" height="84.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="237.0" y="209.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Box source A (pick-and-place)</text>
<text x="237.0" y="229.9" text-anchor="middle" font-size="14" fill="#333">Qwen3-VL boxes on 1 reference image</text>
<text x="237.0" y="249.9" text-anchor="middle" font-size="14" fill="#333">padded +5% (--detection-box-padding-frac)</text>
<rect x="455.0" y="186.0" width="296.0" height="84.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="603.0" y="209.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Box source B (full-scene)</text>
<text x="603.0" y="229.9" text-anchor="middle" font-size="14" fill="#333">Grounding DINO on every frame</text>
<text x="603.0" y="249.9" text-anchor="middle" font-size="14" fill="#333">best-confidence frame per class</text>
<rect x="180.0" y="308.0" width="440.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="331.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Seed SAM2 video predictor</text>
<text x="400.0" y="351.9" text-anchor="middle" font-size="14" fill="#333">1 obj_id per object, box prompt on its seed frame</text>
<polyline points="620.0,340.0 760.0,340.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="315.0" width="353.0" height="50.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="335.0" text-anchor="start" font-size="12" fill="#444">Same class may be seeded more than once</text>
<text x="772.0" y="353.0" text-anchor="start" font-size="12" fill="#444">(different frames) -&gt; several obj_ids per class</text>
<rect x="192.0" y="410.0" width="416.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="433.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Propagate through all frames</text>
<text x="400.0" y="453.9" text-anchor="middle" font-size="14" fill="#333">forward from frame 0, backward from last frame</text>
<polyline points="608.0,442.0 760.0,442.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="417.0" width="346.0" height="50.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="437.0" text-anchor="start" font-size="12" fill="#444">Seeded from several frames -&gt; always cover the</text>
<text x="772.0" y="455.0" text-anchor="start" font-size="12" fill="#444">full video in both directions</text>
<polygon points="282.0,542.0 518.0,542.0 540.0,564.0 518.0,586.0 282.0,586.0 260.0,564.0" fill="#fff4de" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="565.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Object mask empty in a frame?</text>
<polyline points="540.0,564.0 760.0,564.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="512.0" width="528.0" height="104.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="532.0" text-anchor="start" font-size="12" fill="#444">yes -&gt; re-detect with Grounding DINO ONLY IF the object's 3D</text>
<text x="772.0" y="550.0" text-anchor="start" font-size="12" fill="#444">frustum still reprojects to &gt;= 2% of the frame (--reproj_area_threshold)</text>
<text x="772.0" y="568.0" text-anchor="start" font-size="12" fill="#444">otherwise: assume out of view, leave empty</text>
<text x="772.0" y="586.0" text-anchor="start" font-size="12" fill="#444">no COLMAP model / too few points for a frustum -&gt;</text>
<text x="772.0" y="604.0" text-anchor="start" font-size="12" fill="#444">re-detect unconditionally. Only missing obj_ids are re-seeded.</text>
<polygon points="214.0,654.0 600.0,654.0 586.0,718.0 200.0,718.0" fill="#eef3ff" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="677.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Per-object masks</text>
<text x="400.0" y="697.9" text-anchor="middle" font-size="14" fill="#333">&lt;label&gt;/mask_bin/&lt;frame&gt;.png  +  labels.json</text>
<rect x="216.0" y="810.0" width="368.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="833.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Lift mask pixels to 3D</text>
<text x="400.0" y="853.9" text-anchor="middle" font-size="14" fill="#333">VGGT depth + pose, per frame, per object</text>
<polyline points="584.0,842.0 760.0,842.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="790.0" width="570.0" height="104.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="810.0" text-anchor="start" font-size="12" fill="#444">Pixel dropped if it:</text>
<text x="772.0" y="828.0" text-anchor="start" font-size="12" fill="#444">- is claimed by &gt;1 class in that frame (ambiguous)</text>
<text x="772.0" y="846.0" text-anchor="start" font-size="12" fill="#444">- sits on a depth edge (rel. jump &gt; 0.03, --depth_edge_rtol)</text>
<text x="772.0" y="864.0" text-anchor="start" font-size="12" fill="#444">- has depth_conf below the percentile of candidate pixels (--depth_conf_thres)</text>
<text x="772.0" y="882.0" text-anchor="start" font-size="12" fill="#444">Then concat all frames, voxel dedup 5 mm (one real point per cell)</text>
<polygon points="258.0,962.0 542.0,962.0 564.0,984.0 542.0,1006.0 258.0,1006.0 236.0,984.0" fill="#fff4de" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="985.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Hull consensus (RANSAC over frames)</text>
<polyline points="564.0,984.0 760.0,984.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="932.0" width="521.0" height="104.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="952.0" text-anchor="start" font-size="12" fill="#444">Each frame's 3D convex hull is a seed; reproject into all other frames.</text>
<text x="772.0" y="970.0" text-anchor="start" font-size="12" fill="#444">Inlier if &gt;= 50% of that frame's mask falls inside the silhouette</text>
<text x="772.0" y="988.0" text-anchor="start" font-size="12" fill="#444">(--hull_overlap_threshold). Best seed's inliers fuse into one hull;</text>
<text x="772.0" y="1006.0" text-anchor="start" font-size="12" fill="#444">every frame is re-scored. Fail -&gt; frame rejected: its points dropped,</text>
<text x="772.0" y="1024.0" text-anchor="start" font-size="12" fill="#444">masks quarantined + rejection manifest. Frames w/o a detection skipped.</text>
<rect x="180.0" y="1076.0" width="440.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="1099.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Per-point cross-frame validation</text>
<text x="400.0" y="1119.9" text-anchor="middle" font-size="14" fill="#333">reproject each point into every camera (z-buffer)</text>
<polyline points="620.0,1108.0 760.0,1108.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="1074.0" width="493.0" height="68.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="1094.0" text-anchor="start" font-size="12" fill="#444">Reject if fg vote ratio &lt;= 0.6 (--point_consistency_ratio_thres)</text>
<text x="772.0" y="1112.0" text-anchor="start" font-size="12" fill="#444">Points seen with a detection in &lt; 3 frames are kept unconditionally</text>
<text x="772.0" y="1130.0" text-anchor="start" font-size="12" fill="#444">(--point_consistency_min_frames: too little evidence)</text>
<rect x="200.0" y="1180.0" width="400.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="1203.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Background assignment</text>
<text x="400.0" y="1223.9" text-anchor="middle" font-size="14" fill="#333">sparse points &gt; 2 cm from every object point</text>
<polyline points="600.0,1212.0 760.0,1212.0" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="760.0" y="1196.0" width="374.0" height="32.0" rx="4" fill="#fffdf4" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="772.0" y="1216.0" text-anchor="start" font-size="12" fill="#444">--bg_assign_radius 0.02, KD-tree nearest neighbour</text>
<polygon points="190.0,1282.0 624.0,1282.0 610.0,1346.0 176.0,1346.0" fill="#eef3ff" stroke="#333" stroke-width="1.5"/>
<text x="400.0" y="1305.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Per-object clouds</text>
<text x="400.0" y="1325.9" text-anchor="middle" font-size="14" fill="#333">&lt;label&gt;/point_cloud/&lt;label&gt;.ply  +  background.ply</text>
<rect x="121.0" y="1384.0" width="296.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="269.0" y="1407.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Stage 2: MV-SAM3D</text>
<text x="269.0" y="1427.9" text-anchor="middle" font-size="14" fill="#333">per-view masks + view selection</text>
<rect x="447.0" y="1384.0" width="232.0" height="64.0" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="563.0" y="1407.9" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Stage P1 / 5</text>
<text x="563.0" y="1427.9" text-anchor="middle" font-size="14" fill="#333">mesh-to-scene alignment</text>
</svg>