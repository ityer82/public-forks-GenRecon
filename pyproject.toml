[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genrecon"
version = "0.1"
requires-python = ">=3.10,<3.13"
dependencies = [
    "astor==0.8.1",
    "bitsandbytes",
    "easydict>=1.13",
    "einops",
    "flash-attn==2.7.3",
    "gradio==6.0.1",
    "gsplat",
    "hydra-core==1.3.6",
    "igraph==1.0.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "kornia>=0.8.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "lightning==2.3.3",
    "loguru",
    "lpips>=0.1.4",
    "matplotlib>=3.10.9",
    "moge",
    "ninja>=1.13.0",
    "nvdiffrast",
    "nvdiffrec-render",
    "o-voxel",
    "omegaconf==2.3.1",
    "open3d>=0.19.0",
    "optree==0.14.1",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "pillow-simd>=9.5.0.post2",
    "plyfile",
    "psutil>=7.2.2",
    "pymeshfix>=0.17.0",
    "pytorch3d",
    "pyvista==0.49.0",
    "pyyaml>=6.0.3",
    "requests",
    "rerun-sdk>=0.20.0",
    "safetensors",
    "sam2",
    "groundingdino",
    "scipy>=1.15.3",
    "seaborn==0.13.2",
    "spconv-cu126==2.3.8",
    "supervision>=0.29.1",
    "tensorboard>=2.21.0",
    "timm>=1.0.28",
    "torch==2.7.1",
    "torchmetrics",
    "torchvision==0.22.1",
    "tqdm>=4.66.5",
    "transformers==4.57.3",
    "trimesh>=5.0.0",
    "utils3d",
    "xatlas==0.0.11",
    "zstandard>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["genrecon*", "inference*"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "9a4eb15e4021b67b12c460c7057d642626897ec8" }
o-voxel = { workspace = true, editable = true }
sam2 = { workspace = true, editable = true }
groundingdino = { workspace = true, editable = true }
nvdiffrec-render = { git = "https://github.com/JeffreyXiang/nvdiffrec.git", rev = "renderutils" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git", rev = "v0.4.0" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "75ebeeaea0908c5527e7b1e305fbc7681382db47" }
gsplat = { git = "https://github.com/nerfstudio-project/gsplat.git", rev = "2323de5905d5e90e035f792fe65bad0fedd413e7" }
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "a8c37341bc0325ca99b9d57981cc3bb2bd3e255b" }

[tool.uv]
# MoGe's own pyproject.toml pins utils3d to a different git rev than genrecon's
# own pin -- [tool.uv.sources] doesn't override a transitive dependency that's
# already URL-pinned by the requiring package itself, so force genrecon's rev
# project-wide instead.
override-dependencies = [
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]

[tool.uv.workspace]
members = [
    "o-voxel",
    "third_party/sam2",
    "third_party/groundingdino",
]

[tool.uv.extra-build-dependencies]
nvdiffrec-render = ["torch==2.7.1"]
sam2 = ["torch==2.7.1"]
groundingdino = ["torch==2.7.1"]
pytorch3d = ["torch==2.7.1"]
gsplat = ["torch==2.7.1"]

[tool.black]
line-length = 120
